name: Archivio confezioni delle carte
on:
  push:
    branches: [main]
    paths: ['data/packaging/**','scripts/packaging-catalog.mjs','scripts/import-packaging-catalog.mjs','db/packaging-catalog.sql','.github/workflows/packaging-catalog.yml']
  schedule:
    - cron: '13 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: packaging-catalog
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --experimental-strip-types scripts/import-packaging-catalog.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
