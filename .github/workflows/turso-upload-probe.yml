name: Prova caricamento file su Turso
on:
  workflow_dispatch:
    inputs:
      cleanup:
        description: 'Solo eliminare il database di prova upload-probe'
        type: boolean
        default: false
      keep:
        description: 'Lasciare il database di prova per leggere i consumi più tardi'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: turso-upload-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Misura se il caricamento di un file conta come righe scritte
        run: node scripts/turso-upload-probe.mjs
        env:
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
          TURSO_ORGANIZATION: ${{ secrets.TURSO_ORGANIZATION }}
          PROBE_KEEP: ${{ inputs.keep }}
          PROBE_CLEANUP: ${{ inputs.cleanup }}
