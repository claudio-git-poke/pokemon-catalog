name: Pianificatore worker Turso
# GitHub's scheduler skipped almost every scheduled start of this repository.
# This chain waits for the next worker slot (every 30 minutes), starts
# the worker and then restarts itself. Manual dispatches always work, and
# public repositories have free Actions minutes. The cron below only revives
# the chain if it ever stops. Budgets are proportional to the time since the
# previous worker run, so an extra or a missed start does not change spending.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  actions: write
  contents: read
concurrency:
  group: turso-scheduler
  cancel-in-progress: false
jobs:
  next-slot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Attende il prossimo turno e avvia il worker
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          # Slots every 30 minutes (:11 and :41 UTC). Work runs are limited by
          # the worker itself; the group alternates every 3 hours: A from 00,
          # 06, 12 and 18 UTC, B from 03, 09, 15 and 21 UTC.
          best=""
          for d in 0 1; do for h in $(seq 0 23); do for m in 11 41; do
            t=$(date -u -d "$(date -u -d "@$now" +%F) +$d day $h:$m" +%s)
            if [ "$t" -gt "$((now+60))" ] && [ -z "$best" ]; then best=$t; fi
          done; done; done
          wait=$((best-now)); echo "Prossimo turno: $(date -u -d "@$best" '+%F %H:%M UTC') tra $((wait/60)) minuti"
          sleep "$wait"
          hour=$(date -u -d "@$best" +%-H); group=A; if [ $(( (hour/3) % 2 )) -eq 1 ]; then group=B; fi
          # Skip if a worker run is already waiting or running: it will take the slot.
          busy=$(gh api "repos/$REPO/actions/workflows/turso-worker.yml/runs?per_page=5" --jq '[.workflow_runs[]|select(.status=="queued" or .status=="in_progress" or .status=="pending" or .status=="waiting")]|length')
          if [ "$busy" = "0" ]; then
            gh workflow run turso-worker.yml -R "$REPO" -f group="$group" -f publish=true -f sync_minutes=30
            echo "Worker avviato: gruppo $group"
          else
            echo "Worker già in corso o in attesa: turno lasciato a quello"
          fi
      - name: Riavvia la catena
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run turso-scheduler.yml -R "${{ github.repository }}"
