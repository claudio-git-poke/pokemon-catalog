name: Consumi Turso
on:
  workflow_dispatch:
  schedule:
    - cron: '5 * * * *'
permissions:
  contents: read
concurrency:
  group: turso-usage
  cancel-in-progress: true
jobs:
  usage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Legge i consumi ufficiali (nessuna query sul database)
        run: node scripts/check-turso-budget.mjs
        env:
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
          TURSO_ORGANIZATION: ${{ secrets.TURSO_ORGANIZATION }}
          TURSO_STOP_RATIO: '0.9'
          TURSO_STOP_RATIO_UNTIL: '2026-12-01T00:00:00Z'
