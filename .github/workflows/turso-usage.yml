name: Consumi Turso
on:
  workflow_dispatch:
  schedule:
    - cron: '5 * * * *'
permissions:
  contents: read
concurrency:
  group: turso-usage
  cancel-in-progress: true
jobs:
  usage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Legge i consumi ufficiali (nessuna query sul database)
        run: node scripts/check-turso-budget.mjs
        env:
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
          TURSO_ORGANIZATION: ${{ secrets.TURSO_ORGANIZATION }}
          TURSO_STOP_RATIO: '0.9'
          TURSO_STOP_RATIO_UNTIL: '2026-12-01T00:00:00Z'
          # Novembre: ogni turno pubblica il massimo (250.000 stimate) fino al 90%;
          # poi il margine fino al 95% si distribuisce sui giorni rimasti, a turni
          # di al massimo 100.000. Dal 1° dicembre tornano le regole normali.
          TURSO_SPEND_BY: '2026-11-19T20:00:00Z'
          TURSO_MAX_RUN_WRITES: '250000'
          TURSO_FRONT_LOAD_UNTIL: '2026-12-01T00:00:00Z'
          TURSO_ENDGAME_RATIO: '0.95'
          TURSO_ENDGAME_AT: '0.9'
          TURSO_ENDGAME_MAX_RUN_WRITES: '100000'
          TURSO_RUNS_PER_DAY: '1'
          # Scritture reali per scrittura stimata, misurate il 19/11/2026 (0,64-0,74).
          TURSO_ESTIMATE_RATIO: '1'
