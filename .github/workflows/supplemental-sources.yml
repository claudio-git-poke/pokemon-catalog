name: Fonti aggiuntive EN TH ID
on:
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/supplemental-sources.mjs'
      - 'scripts/run-supplemental-sources.mjs'
      - '.github/workflows/supplemental-sources.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supplemental-sources
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: type-null/PTCG-database
          path: .catalog-data
          sparse-checkout: data_en
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --experimental-strip-types scripts/run-supplemental-sources.mjs
        env:
          ATLAS_DATA_DIR: .catalog-data
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
