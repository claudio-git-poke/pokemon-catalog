name: Recupero tag carte esistenti
on:
  push:
    branches: [main]
    paths:
      - 'scripts/backfill-catalog-tags.mjs'
      - 'scripts/tag-backlog.mjs'
      - 'scripts/enrich-catalog.mjs'
      - 'scripts/catalog-logger.mjs'
      - 'scripts/database-errors.mjs'
      - '.github/workflows/catalog-tags.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalog-tags-backfill
  cancel-in-progress: false
jobs:
  tags:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --experimental-strip-types scripts/backfill-catalog-tags.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
