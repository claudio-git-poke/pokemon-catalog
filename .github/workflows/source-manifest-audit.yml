name: Confronto elenchi e collegamenti alle carte
on:
  schedule:
    - cron: '11,41 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/source-manifest-audit.mjs'
      - 'scripts/run-source-manifest-audit.mjs'
      - 'scripts/catalog-manifest.mjs'
      - 'db/source-manifest-audit.sql'
      - '.github/workflows/source-manifest-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-manifest-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: type-null/PTCG-database
          path: .catalog-data
          sparse-checkout: |
            data_en
            data_jp
            data_ko
            data_tc
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --experimental-strip-types scripts/run-source-manifest-audit.mjs
        env:
          ATLAS_DATA_DIR: .catalog-data
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
